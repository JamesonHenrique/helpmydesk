[workspace]
resolver = "3"
members = ["crates/hmd-domain", "crates/hmd-policy", "crates/hmd-catalog", "crates/hmd-probes", "crates/hmd-core", "crates/hmd-executor", "crates/hmd-store", "crates/hmd-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/JamesonHenrique/helpmydesk"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
