[package]
name = "helpmydesk"
description = "HelpMyDesk desktop shell (Tauri): one command per hmd-ipc use case (spec 013)"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/JamesonHenrique/helpmydesk"
rust-version = "1.99"
publish = false

# Separate workspace: it needs WebKitGTK on Linux, so it stays out of the main workspace (local
# checks keep working without it). CI builds it on Linux and Windows. ADR-025.
[workspace]

[lib]
name = "helpmydesk_lib"

# `custom-protocol` makes the binary serve the built UI (`frontendDist`); without it Tauri runs in
# dev mode and loads `devUrl` (http://localhost:4200). On by default because this project builds
# with plain cargo; for live reload use `ng serve` + `cargo run --no-default-features`.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
hmd-ipc = { path = "../../../crates/hmd-ipc" }
hmd-probes = { path = "../../../crates/hmd-probes" }
hmd-vault = { path = "../../../crates/hmd-vault" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-clipboard-manager = "=2.4.0"
tauri-plugin-opener = "=2.7.0"

[dev-dependencies]
# Mock runtime and IPC helpers for the ACL tests; serde_json is already in Tauri's tree.
tauri = { version = "=2.12.1", features = ["test"] }
serde_json = "1"
hmd-probes = { path = "../../../crates/hmd-probes" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
