name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: UI texts match the catalog
        if: runner.os == 'Linux'
        run: |
          cargo run -q --locked -p hmd-core --example ui_fixtures > /tmp/catalog.generated.ts
          diff -u apps/desktop/ui/src/app/data/catalog.generated.ts /tmp/catalog.generated.ts

  ui:
    name: UI prototype (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=high
      - name: Format
        run: npx prettier --check "src/**/*.{ts,html,css}"
      - name: Test
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  desktop:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Build the UI the shell embeds
        working-directory: apps/desktop/ui
        run: |
          npm ci --ignore-scripts
          npx ng build
      - name: WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - name: Format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check
      - name: Lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Build
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked

  guards:
    name: Constitution guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: No process spawning outside executor/helper
        run: tools/check-no-process-spawn.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
