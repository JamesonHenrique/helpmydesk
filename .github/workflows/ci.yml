name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: UI texts match the catalog
        if: runner.os == 'Linux'
        run: |
          cargo run -q --locked -p hmd-core --example ui_fixtures > /tmp/catalog.generated.ts
          diff -u apps/desktop/ui/src/app/data/catalog.generated.ts /tmp/catalog.generated.ts

  ui:
    name: UI prototype (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=high
      - name: Format
        run: npx prettier --check "src/**/*.{ts,html,css}"
      - name: Test
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  desktop:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Build the UI the shell embeds
        working-directory: apps/desktop/ui
        run: |
          npm ci --ignore-scripts
          npx ng build
      - name: WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - name: Format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check
      - name: Lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Build
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked
      # Linux only: Windows test binaries lack the app manifest Tauri embeds in the real exe
      # (STATUS_ENTRYPOINT_NOT_FOUND). The permission logic does not depend on the platform; the
      # Windows smoke test below runs the real executable.
      - name: Test (IPC and window permissions on the mock runtime)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Smoke test, the interface loads (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          set +e
          timeout 20 xvfb-run -a ./target/debug/helpmydesk 2> app.log
          code=$?
          set -e
          cat app.log
          echo "exit code: $code (124 = still running when stopped)"
          test "$code" -eq 124
          grep -q "helpmydesk: interface ready" app.log
      - name: Smoke test, the interface loads (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\target\debug\helpmydesk.exe -PassThru -RedirectStandardError app.log
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "app exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 1
          Get-Content app.log
          if (-not (Select-String -Path app.log -Pattern "helpmydesk: interface ready" -Quiet)) { Write-Error "the interface did not load"; exit 1 }

  guards:
    name: Constitution guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: No process spawning outside executor/helper
        run: tools/check-no-process-spawn.sh

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Main workspace
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --config deny.toml
      - name: Desktop shell
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --config deny.toml

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
