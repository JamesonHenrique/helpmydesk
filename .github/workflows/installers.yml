# Installers (ADR-029, spec 020 T015): `.deb` and NSIS, the helper inside the Windows one. Called by
# the CI (test builds) and by the release workflow, so both build the installers the same way.
name: Installers

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 14

permissions:
  contents: read

jobs:
  installers:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-2025
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Build the UI
        working-directory: apps/desktop/ui
        run: |
          npm ci --ignore-scripts
          npx ng build
      - name: WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      # Spec 020 T015: the elevated helper goes into the Windows installer as a sidecar, next to the
      # app in Program Files. Tauri wants it named with the target triple.
      - name: Elevated helper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p hmd-elevated
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/helpmydesk-elevated.exe "apps/desktop/src-tauri/binaries/helpmydesk-elevated-${triple}.exe"
      - name: Bundle
        working-directory: apps/desktop
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then extra=(--config src-tauri/windows/helper.conf.json); fi
          node ui/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundle }} "${extra[@]}"
      - name: The installer carries the helper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          installer=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          7z l "$installer" > installer-files.txt
          cat installer-files.txt
          grep -q 'helpmydesk-elevated.exe' installer-files.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helpmydesk-${{ matrix.bundle }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
