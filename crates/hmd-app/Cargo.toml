[package]
name = "hmd-app"
description = "HelpMyDesk application service: the use cases the desktop UI calls (spec 012)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Leaf crate (depends on hmd-store, which bundles SQLite; see ADR-023).
[dependencies]
hmd-domain = { path = "../hmd-domain" }
hmd-policy = { path = "../hmd-policy" }
hmd-catalog = { path = "../hmd-catalog" }
hmd-probes = { path = "../hmd-probes" }
hmd-core = { path = "../hmd-core" }
hmd-executor = { path = "../hmd-executor" }
# Elevation path of the host platform (spec 020); the production allowlist is empty until S-02.
hmd-elevated = { path = "../hmd-elevated" }
hmd-killswitch = { path = "../hmd-killswitch" }
hmd-store = { path = "../hmd-store" }
hmd-ai = { path = "../hmd-ai" }

[dev-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
serde_json = "=1.0.151"

[lints]
workspace = true
