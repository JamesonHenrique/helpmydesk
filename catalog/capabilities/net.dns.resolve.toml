id = "net.dns.resolve"
version = "1.0.0"
kind = "probe"
family = "connectivity"
produces = ["net.dns.resolution_failing"]

# Resolves a fixed list of names compiled into the probe; never names from the model or the person.
[variants.windows]
risk_level = "N1-B"
max_per_session = 5

[variants.linux]
risk_level = "N1-B"
max_per_session = 5

[copy.pt-BR]
title = "Tradução de nomes de sites (DNS)"
looks_at = "Se três nomes fixos de sites (dns.google, one.one.one.one e www.microsoft.com) viram endereços de internet."
never = "Os sites que você visita ou seu histórico de navegação."
