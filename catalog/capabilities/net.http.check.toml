id = "net.http.check"
version = "1.0.0"
kind = "probe"
family = "connectivity"
produces = ["net.internet.unreachable", "net.captive_portal_suspected"]

[variants.windows]
risk_level = "N1-B"
max_per_session = 5

[variants.linux]
risk_level = "N1-B"
max_per_session = 5

[copy.pt-BR]
title = "Acesso à internet"
looks_at = "Se endereços fixos de teste do Google e da Microsoft respondem como esperado e, se não, se os endereços públicos 1.1.1.1 e 8.8.8.8 respondem."
never = "Os sites que você visita. Nada seu é enviado: só um pedido de teste fixo."
