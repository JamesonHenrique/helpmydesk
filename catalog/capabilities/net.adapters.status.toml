id = "net.adapters.status"
version = "1.0.0"
kind = "probe"
family = "connectivity"
produces = ["net.no_active_adapter", "net.no_valid_ip"]

[variants.windows]
risk_level = "N1-A"
max_per_session = 5

[variants.linux]
risk_level = "N1-A"
max_per_session = 5

[copy.pt-BR]
title = "Placa de rede e endereço"
looks_at = "Se há uma placa de rede ligada e se ela tem um endereço válido."
never = "Endereço físico da placa (MAC), nome da rede Wi-Fi, nomes das placas e endereços IP (o endereço é só conferido)."
