# Supply-chain policy (ADR-022..025): licenses compatible with GPL-3.0-or-later, RustSec
# advisories, crates only from crates.io. Run: `cargo deny check` (here and in
# apps/desktop/src-tauri with `--config ../../../deny.toml`).

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
all-features = false
no-default-features = false

[advisories]
# Unmaintained crates are reported for the whole tree; vulnerabilities always fail.
unmaintained = "workspace"
ignore = []

[licenses]
# Every license here can be combined with GPL-3.0-or-later.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# Our own crates are GPL-3.0-or-later and never published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
